<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <div class="cabecera">
      <div class="opciones">
        <select name="" id="">
          <option value="">Publicaciones</option>
        </select>
      </div>
      <div class="opciones">Biblioteca</div>
      <div class="opciones">Eventos Academicos</div>
      <div class="opciones">
        <select name="" id="">
          <option value="">Geoinformacion</option>
        </select>
      </div>
      <div class="opciones">
        <select name="" id="">
          <option value="">Sorteo de causas</option>
        </select>
      </div>
      <div class="opciones">Contactanos</div>
      <div class="iconos">
        <img src="img/image01.png" alt="" class="icono" />
        <img src="img/image02.png" alt="" class="icono" />
        <img src="img/image03.png" alt="" class="icono" />
        <img src="img/image04.png" alt="" class="icono" />
        <img src="img/image05.png" alt="" class="icono" />
      </div>
    </div>
    <div class="cuerpo2">
      <img
        class="img1"
        src="images/Tribunal-Agroambiental-de-Bolivia-2048x423.png "
        alt=""
      />
    </div>
    <div class="cabeceramedia" style="margin-top: 0px">
      <div class="opciones">Inicio</div>

      <div class="opciones">
        <select name="" id="">
          <option value="">Institucional</option>
        </select>
      </div>
      <div class="opciones">
        <select name="" id="">
          <option value="">Buscadores</option>
        </select>
      </div>
      <div class="opciones">Arbol de Jurisprudencia</div>

      <div class="opciones">
        <select name="" id="">
          <option value="">Transparencia</option>
        </select>
      </div>
      <div class="opciones">Noticias</div>
      <div class="buscador">
        <input
          type="text"
          name="btn"
          style="width: 100px"
          placeholder="Escriba y Presiona"
        />
        <button type="submit" style="width: 40px" name="btn">
          <img src="images/lupa.jpg" alt="" style="height: 15px" />
        </button>
      </div>
    </div>
    <div class="img2">
      <img src="images/Virtual.png" alt="" height="100%" width="100%" />
    </div>
    <div class="linea"></div>
    <div class="columnas">
      <div class="primeracolumna">
        <div class="cab">
          <div class="punto"></div>
          <div class="alaire">Al Aire</div>
        </div>
        <div class="aud">
          <audio controls class="audio" src="">
            <source src="images/audio.mp3" type="audio/mpeg" />
          </audio>
        </div>
        <div class="concilicacion"></div>
      </div>
      <div class="segundacolumna"></div>
      <div class="terceracolumna"></div>
    </div>
  </body>
</html>

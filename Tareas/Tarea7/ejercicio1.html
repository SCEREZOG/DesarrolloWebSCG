<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var num1 = parseInt(prompt("Introduce el valor de A: "));
      var num2 = parseInt(prompt("Introduce el valor de B: "));
      var num3 = parseInt(prompt("Introduce el valor de C: "));
      var num4 = parseInt(prompt("Introduce el valor de D: "));

      if (num1 > num2 && num1 > num3 && num1 > num4) {
        document.write("El número mayor es: " + num1);
      } else if (num2 > num1 && num2 > num3 && num2 > num4) {
        document.write("El número mayor es: " + num2);
      } else if (num3 > num1 && num3 > num2 && num3 > num4) {
        document.write("El número mayor es: " + num3);
      } else {
        document.write("El número mayor es: " + num4);
      }
    </script>
  </body>
</html>
